<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Claim Processor</title>
    <style>
        :root {
            --bg-color: #020617;
            --text-color: #f8fafc;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .nav {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
        }

        .nav a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 12px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav a:hover {
            color: white;
            background: rgba(30, 41, 59, 0.8);
            border-color: var(--accent-secondary);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(96, 165, 250, 0.2);
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #94a3b8;
        }

        select, textarea {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            background: rgba(2, 6, 23, 0.6);
            border: 1px solid #334155;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .file-upload-wrapper {
            position: relative;
            width: 100%;
            height: 150px;
            border: 2px dashed #334155;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(2, 6, 23, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            overflow: hidden;
        }

        .file-upload-wrapper:hover {
            border-color: var(--accent-secondary);
            background: rgba(30, 41, 59, 0.4);
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 2;
        }

        .file-upload-text {
            text-align: center;
            color: #94a3b8;
            pointer-events: none;
        }

        .file-preview-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .file-preview {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #334155;
        }

        .btn-primary {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.5);
            margin-top: 20px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -10px rgba(59, 130, 246, 0.7);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Results Panel */
        #results-panel {
            display: none;
            margin-top: 30px;
            animation: fadeInUp 0.5s ease-out;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .result-item {
            background: rgba(2, 6, 23, 0.6);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .result-label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .status-supported { color: #4ade80; }
        .status-contradicted { color: #f87171; }
        .status-not_enough_information { color: #fbbf24; }

        .loader {
            display: none;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <!-- Three.js for 3D visuals -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="container">
        <div class="nav">
            <a href="about.html">ℹ️ About Project</a>
        </div>

        <div class="header">
            <h1>Live AI Claim Analysis</h1>
            <p style="color: #94a3b8;">Upload evidence and instantly verify the claim using our VLM agent.</p>
        </div>

        <div class="glass-panel">
            <form id="claim-form">
                <div class="form-group">
                    <label for="claim_object">What is being claimed?</label>
                    <select id="claim_object" required>
                        <option value="car">Car</option>
                        <option value="laptop">Laptop</option>
                        <option value="package">Package</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="user_claim">Conversation / Claim Details</label>
                    <textarea id="user_claim" placeholder="E.g., Customer: My laptop screen is cracked. Agent: Is the keyboard damaged? Customer: No, only the screen." required></textarea>
                </div>

                <div class="form-group">
                    <label>Photographic Evidence (Multiple allowed)</label>
                    <div class="file-upload-wrapper">
                        <div class="file-upload-text">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 10px;">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg><br>
                            Click to upload images or drag and drop
                        </div>
                        <input type="file" id="images" accept="image/*" multiple required>
                    </div>
                    <div class="file-preview-container" id="preview-container"></div>
                </div>

                <button type="submit" class="btn-primary" id="submit-btn">
                    <span id="btn-text">Analyze Claim</span>
                    <div class="loader" id="loader"></div>
                </button>
            </form>

            <div id="results-panel" class="glass-panel" style="margin-top: 30px; padding: 30px; background: rgba(15, 23, 42, 0.8);">
                <h3 style="margin-top: 0; color: #38bdf8;">Analysis Results</h3>
                <div class="result-grid">
                    <div class="result-item">
                        <div class="result-label">Status</div>
                        <div class="result-value" id="res-status">...</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Object Part</div>
                        <div class="result-value" id="res-part">...</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Issue Type</div>
                        <div class="result-value" id="res-issue">...</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Risk Flags</div>
                        <div class="result-value" id="res-flags" style="color: #fbbf24;">...</div>
                    </div>
                </div>
                <div class="result-item" style="margin-top: 20px;">
                    <div class="result-label">AI Justification</div>
                    <div class="result-value" id="res-justification" style="font-size: 0.95rem; font-weight: normal; color: #cbd5e1; line-height: 1.5;">...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 3D Background Logic ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Create particles
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 700;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 15;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const material = new THREE.PointsMaterial({
            size: 0.02,
            color: 0x8b5cf6,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particlesMesh = new THREE.Points(particlesGeometry, material);
        scene.add(particlesMesh);
        camera.position.z = 3;

        // Mouse interaction
        let mouseX = 0;
        let mouseY = 0;
        document.addEventListener('mousemove', (event) => {
            mouseX = event.clientX / window.innerWidth - 0.5;
            mouseY = event.clientY / window.innerHeight - 0.5;
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            particlesMesh.rotation.y = elapsedTime * 0.05;
            particlesMesh.rotation.x = elapsedTime * 0.02;

            particlesMesh.position.x += (mouseX * 2 - particlesMesh.position.x) * 0.05;
            particlesMesh.position.y += (-mouseY * 2 - particlesMesh.position.y) * 0.05;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Form Logic ---
        const fileInput = document.getElementById('images');
        const previewContainer = document.getElementById('preview-container');
        let selectedFiles = [];

        fileInput.addEventListener('change', (e) => {
            previewContainer.innerHTML = '';
            selectedFiles = Array.from(e.target.files);
            
            selectedFiles.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'file-preview';
                    previewContainer.appendChild(img);
                }
                reader.readAsDataURL(file);
            });
        });

        document.getElementById('claim-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btnText = document.getElementById('btn-text');
            const loader = document.getElementById('loader');
            const submitBtn = document.getElementById('submit-btn');
            
            btnText.style.display = 'none';
            loader.style.display = 'block';
            submitBtn.disabled = true;
            document.getElementById('results-panel').style.display = 'none';

            // Convert images to base64
            const getBase64 = (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });

            try {
                const imagePromises = selectedFiles.map(file => getBase64(file));
                const base64Images = await Promise.all(imagePromises);

                const payload = {
                    claim_object: document.getElementById('claim_object').value,
                    user_claim: document.getElementById('user_claim').value,
                    images: base64Images // Array of data URLs
                };

                const response = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errText}`);
                }

                const data = await response.json();
                
                // Display results
                const statusEl = document.getElementById('res-status');
                statusEl.textContent = data.claim_status.toUpperCase();
                statusEl.className = 'result-value status-' + data.claim_status;
                
                document.getElementById('res-part').textContent = data.object_part;
                document.getElementById('res-issue').textContent = data.issue_type;
                document.getElementById('res-flags').textContent = data.risk_flags === 'none' ? 'None' : data.risk_flags;
                document.getElementById('res-justification').textContent = data.claim_status_justification;
                
                document.getElementById('results-panel').style.display = 'block';

            } catch (error) {
                alert('ERROR DETAILS: ' + error.message);
                console.error(error);
            } finally {
                btnText.style.display = 'block';
                loader.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
